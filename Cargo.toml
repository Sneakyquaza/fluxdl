[package]
# Nom provisoire : à changer ici et dans `APP_NAME` (src/lib.rs).
name = "fluxdl"
version = "0.2.8"
edition = "2021"
license = "MIT"
description = "Free open-source multi-connection download manager"

[lib]
name = "dlcore"
path = "src/lib.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "clipboard"] }
# Presse-papiers (déjà tiré par la fonction `clipboard` d'eframe) : bouton « Coller ».
arboard = { version = "3.6", default-features = false }
# Captures PNG (--capture) et fond d’écran JPEG embarqué.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP bloquant + fils : petit exe, HTTPS par rustls (pas d'OpenSSL).
ureq = { version = "2.12", default-features = false, features = ["tls"] }
ring = "0.17"
# Torrents et liens magnet (Apache-2.0) ; tokio seulement pour sa session.
librqbit = { version = "9.1", default-features = false, features = ["rust-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
# Extraction des archives finies : zip (deflate par flate2, déjà tiré par librqbit), 7z (LZMA/LZMA2).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
sevenz-rust2 = { version = "0.25", default-features = false }

# Sélecteur de dossier natif (Windows : IFileOpenDialog, sans dépendance lourde). Linux :
# zenity/kdialog s'ils sont installés, sinon champ texte seulement.
# Place libre sur le disque avant un téléchargement (statvfs ; déjà tiré par d'autres crates).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }

[dev-dependencies]
# Tests : archives 7z créées à la volée.
sevenz-rust2 = { version = "0.25", default-features = false, features = ["compress"] }

[build-dependencies]
# Icône .ico de l'exe Windows (entrées PNG), dessinée par src/icone.rs.
png = "0.18"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
